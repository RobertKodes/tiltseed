<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110d" />
    <meta
      name="description"
      content="Tilt the glass (or drag a virtual horizon). Hash the trail. Get a Solana-ish address out."
    />
    <title>tiltseed</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="case" class="case" data-mode="virtual">
      <div class="grain" aria-hidden="true"></div>
      <header class="mast">
        <h1>tiltseed</h1>
        <p>orientation as input</p>
      </header>
      <div class="lamp" id="lamp">virtual</div>
      <main class="stage">
        <p class="status" id="status">drag the horizon — or hold to seed</p>
        <div class="gyro-wrap">
          <canvas
            id="gyro"
            class="gyro"
            width="320"
            height="320"
            role="img"
            aria-label="Virtual horizon. Drag to tilt."
          ></canvas>
        </div>
        <button id="hold" class="hold" type="button" aria-pressed="false">
          <span class="hold-face">
            <span id="hold-word" class="hold-word">hold to seed</span>
            <span id="hold-meter" class="hold-meter"></span>
          </span>
        </button>
        <section id="plate" class="plate" hidden>
          <p class="plate-kicker">callsign</p>
          <code id="address" class="address"></code>
          <div id="chips" class="chips"></div>
          <p id="crumb" class="crumb"></p>
          <div class="acts">
            <button id="copy" class="act" type="button">copy address</button>
            <button id="again" class="act ghost" type="button">again</button>
          </div>
        </section>
      </main>
      <footer class="well">
        <button id="enable" class="ghost-link" type="button" hidden>enable sensors</button>
        <button id="mode" class="ghost-link" type="button" hidden>use drag instead</button>
        <p class="note">
          Preview seed from the tilt — not a program-derived PDA. Sibling to
          <a href="https://robertkodes.github.io/micseed/">micseed</a>,
          <a href="https://robertkodes.github.io/camseed/">camseed</a>,
          <a href="https://robertkodes.github.io/drawseed/">drawseed</a>.
          On a phone, enable sensors (iOS asks once). On a desk, drag the glass.
          Don’t send funds to a wobble.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
